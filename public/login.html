<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-mode="login">
<header id="header"></header>
<main class="w"><div class="card auth"><h2>Welcome back</h2>
<form id="f"><label for="e">Email</label><input id="e" type="email" required autocomplete="email">
<label for="p">Password</label><input id="p" type="password" required autocomplete="current-password">
<p class="err" id="err" role="alert"></p><button class="primary" style="width:100%">Log in</button></form>
<p class="center" style="margin-bottom:0">New here? <a href="/signup">Create an account</a></p></div></main>
<footer id="footer"></footer>
<script src="/js/common.js"></script><script src="/js/auth.js"></script>
</body></html>
